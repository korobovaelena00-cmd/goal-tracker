<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050810">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Предпром — выбор сборки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#050810;color:#e8f0ff;font-family:-apple-system,Segoe UI,Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px}
.h{font-size:13px;letter-spacing:.12em;text-transform:uppercase;opacity:.55;text-align:center;margin-bottom:4px}
.card{display:flex;flex-direction:column;gap:4px;padding:20px;border-radius:18px;text-decoration:none;color:#e8f0ff;border:1px solid rgba(255,255,255,.10);background:rgba(20,26,40,.72);backdrop-filter:blur(10px)}
.card b{font-size:17px;font-weight:600}
.card small{font-size:12px;opacity:.6}
.card:active{transform:scale(.99)}
.s{border-left:4px solid #3fd0ff}
.p{border-left:4px solid #ffb347}
</style>
</head>
<body>
<div class="wrap">
  <div class="h">Куда зайти</div>
  <a class="card s" href="../"><b>🎯 Стабильная версия</b><small>То, что видят все пользователи</small></a>
  <a class="card p" href="../preview/?cohort=preview"><b>🧪 Предпром</b><small>Тестовая сборка — только для тебя</small></a>
</div>
</body>
</html>
